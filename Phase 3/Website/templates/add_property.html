{% extends "base.html" %}
{% block title %}— Add Property{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card wide">
    <h1>Add New Property Listing</h1>
    <p class="form-sub">Fill in the details below — status will be set to Available automatically</p>

    <form method="POST">

      <div class="form-group">
        <label>Property Title *</label>
        <input type="text" name="title" required
               placeholder="e.g. 3-Bedroom Family Home in Mafikeng"/>
      </div>

      <div class="form-group">
        <label>Street Address *</label>
        <input type="text" name="street" required
               placeholder="e.g. 12 Baobab Street"/>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Property Type *</label>
          <select name="property_type_id" required>
            <option value="">Select type...</option>
            {% for t in prop_types %}
              <option value="{{ t['propertytypeid'] or t['propertytypeid'] }}">
                {{ t['typename'] or t['typename'] }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Location *</label>
          <select name="location_id" required>
            <option value="">Select location...</option>
            {% for l in locations %}
              <option value="{{ l['locationid'] or l['locationid'] }}">
                {{ l['city'] or l['city'] }}, {{ l['province'] or l['province'] }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Price (R) *</label>
          <input type="number" name="price" step="0.01" required
                 placeholder="e.g. 850000"/>
        </div>
        <div class="form-group">
          <label>Size (m²) *</label>
          <input type="number" name="size_sqm" step="0.01" required
                 placeholder="e.g. 180"/>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Bedrooms</label>
          <input type="number" name="bedrooms" value="0" min="0"/>
        </div>
        <div class="form-group">
          <label>Bathrooms</label>
          <input type="number" name="bathrooms" value="0" min="0"/>
        </div>
      </div>

      <button type="submit" class="btn-primary full-w">Add Listing</button>
      <a href="{{ url_for('agent_dashboard') }}"
         class="btn-outline full-w" style="margin-top:8px">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
