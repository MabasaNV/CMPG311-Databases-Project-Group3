{% extends "base.html" %}
{% block title %}— Register{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <h1>Create Your Account</h1>
    <p class="form-sub">Register to browse, save, and enquire about properties</p>

    <form method="POST">
      <div class="form-row-2">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="first_name" required placeholder="e.g. Tebogo"/>
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" name="last_name" required placeholder="e.g. Morake"/>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="email" required placeholder="you@email.com"/>
      </div>

      <div class="form-group">
        <label>Contact Number *</label>
        <input type="text" name="contact" required placeholder="0XX XXX XXXX"/>
      </div>

      <div class="form-group">
        <label>I am a *</label>
        <select name="client_type" required>
          <option value="Buyer">Buyer — looking to purchase</option>
          <option value="Tenant">Tenant — looking to rent</option>
          <option value="Seller">Seller — listing my property</option>
          <option value="Landlord">Landlord — renting out property</option>
        </select>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Budget Min (R)</label>
          <input type="number" name="budget_min" placeholder="e.g. 500000"/>
        </div>
        <div class="form-group">
          <label>Budget Max (R)</label>
          <input type="number" name="budget_max" placeholder="e.g. 1000000"/>
        </div>
      </div>

      <div class="form-group">
        <label>Preferred Location</label>
        <input type="text" name="pref_location" placeholder="e.g. Mafikeng"/>
      </div>

      <div class="form-group">
        <label>Preferred Property Type</label>
        <input type="text" name="pref_type" placeholder="e.g. Residential House"/>
      </div>

      <button type="submit" class="btn-primary full-w">Create Account</button>
    </form>

    <p class="form-footer">
      Already have an account? <a href="{{ url_for('client_login') }}">Log in here</a>
    </p>
  </div>
</div>
{% endblock %}
